name: Build Windows exe
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --onefile --windowed --name PhoneLauncher phone_launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneLauncher
          path: dist/PhoneLauncher.exe
