name: Build Windows exe
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icon-helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build iconhelper.jar (dex)
        run: |
          set -e
          PLAT=$(ls -d $ANDROID_HOME/platforms/android-* | sort -V | tail -1)
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "platform=$PLAT build-tools=$BT"
          mkdir -p out/classes
          javac --release 8 -cp "$PLAT/android.jar" -d out/classes android/src/IconDump.java
          "$BT/d8" --min-api 21 --lib "$PLAT/android.jar" --output out/iconhelper.jar $(find out/classes -name '*.class')
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: iconhelper
          path: out/iconhelper.jar

  emulator-test:
    needs: icon-helper
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 30
            target: default
          - api: 34
            target: google_apis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: iconhelper
      - run: sudo apt-get install -y -q libegl1 libxkbcommon0 >/dev/null && pip install -q PySide6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run icon helper on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          script: |
            adb push iconhelper.jar /data/local/tmp/pl_icons.jar
            adb shell ICONDUMP_DEBUG=1 CLASSPATH=/data/local/tmp/pl_icons.jar app_process / IconDump 96 com.android.settings com.android.contacts com.android.vending com.google.android.apps.maps no.such.app > icons.txt 2>&1; cat icons.txt | cut -c1-200
            adb shell cmd package resolve-activity --brief -c android.intent.category.LAUNCHER com.android.settings
            test "$(grep -c '^com.android.settings iVBOR' icons.txt)" = "1"
            grep -q '^no.such.app - ' icons.txt
            grep '^com.android.settings iVBOR' icons.txt | cut -d' ' -f2 | base64 -d > settings.png && ls -la settings.png
            echo "ICON HELPER OK"
            QT_QPA_PLATFORM=offscreen python3 tests/emu_unlock.py

  build:
    needs: icon-helper
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: iconhelper
          path: assets
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download latest scrcpy (win64)
        shell: pwsh
        run: |
          $rel = gh api repos/Genymobile/scrcpy/releases/latest | ConvertFrom-Json
          $asset = $rel.assets | Where-Object { $_.name -match '^scrcpy-win64-v[\d.]+\.zip$' } | Select-Object -First 1
          if (-not $asset) { throw "scrcpy win64 asset not found" }
          Write-Host "scrcpy $($rel.tag_name): $($asset.name)"
          Invoke-WebRequest $asset.browser_download_url -OutFile scrcpy.zip
          Expand-Archive scrcpy.zip -DestinationPath scrcpy_tmp
          $dir = Get-ChildItem scrcpy_tmp -Directory | Select-Object -First 1
          Move-Item $dir.FullName scrcpy
          Invoke-WebRequest https://raw.githubusercontent.com/Genymobile/scrcpy/master/LICENSE -OutFile scrcpy/LICENSE-scrcpy.txt
          "SCRCPY_VERSION=$($rel.tag_name)" >> $env:GITHUB_ENV
          Get-ChildItem scrcpy

      - run: pip install -r requirements.txt pyinstaller pefile
      - name: Write build info
        shell: pwsh
        run: |
          $kst = [System.TimeZoneInfo]::ConvertTimeBySystemTimeZoneId((Get-Date).ToUniversalTime(), 'Korea Standard Time')
          $sha = "${{ github.sha }}".Substring(0,7)
          "BUILD = `"빌드 $($kst.ToString('MM-dd HH:mm')) · $sha`"" | Out-File _build_info.py -Encoding utf8

      - name: Build single exe (launcher + scrcpy + adb)
        run: pyinstaller --noconfirm --onefile --windowed --name PhoneLauncher --icon assets/icon.ico --add-data "scrcpy;scrcpy" --add-data "assets;assets" --hidden-import _build_info phone_launcher.py

      - name: Verify exe icon is embedded
        shell: python
        run: |
          import pefile, struct
          pe = pefile.PE("dist/PhoneLauncher.exe")
          groups = []
          for t in pe.DIRECTORY_ENTRY_RESOURCE.entries:
              if t.id == 14:  # RT_GROUP_ICON
                  for e in t.directory.entries:
                      for l in e.directory.entries:
                          d = pe.get_data(l.data.struct.OffsetToData, l.data.struct.Size)
                          groups.append(struct.unpack("<HHH", d[:6])[2])
          print("icon groups:", groups)
          assert groups and groups[0] == 10, "custom icon (10 sizes) not embedded"
          print("ICON OK")

      - name: Smoke test (exe starts and stays up)
        shell: pwsh
        run: |
          $p = Start-Process dist/PhoneLauncher.exe -ArgumentList "--no-save" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "PhoneLauncher exited early with code $($p.ExitCode)" }
          Get-Process | Where-Object { $_.MainWindowTitle -like "*폰 런처*" } | Select-Object Id, MainWindowTitle | Format-Table
          Stop-Process -Id $p.Id -Force
          Get-Process adb -ErrorAction SilentlyContinue | Stop-Process -Force
          Write-Host "SMOKE OK"

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory release | Out-Null
          Copy-Item dist/PhoneLauncher.exe release/
          Copy-Item scrcpy/LICENSE-scrcpy.txt release/
          @"
          PhoneLauncher.exe includes scrcpy $env:SCRCPY_VERSION (https://github.com/Genymobile/scrcpy),
          licensed under the Apache License 2.0 (see LICENSE-scrcpy.txt),
          and Android platform-tools (adb) as shipped in the scrcpy release.
          "@ | Out-File release/THIRD-PARTY-NOTICES.txt -Encoding utf8
          Compress-Archive release/* PhoneLauncher-win64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneLauncher-win64
          path: release/

      - name: Publish to "latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: PhoneLauncher (latest build, scrcpy ${{ env.SCRCPY_VERSION }})
          body: |
            PhoneLauncher.exe 하나만 받아서 실행하면 돼요 (scrcpy ${{ env.SCRCPY_VERSION }} + adb 내장, 파이썬 불필요).
            자동 빌드: ${{ github.sha }}
          prerelease: false
          make_latest: true
          files: |
            release/PhoneLauncher.exe
            PhoneLauncher-win64.zip
